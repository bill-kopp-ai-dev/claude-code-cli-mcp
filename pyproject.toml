[project]
name = "claude-code-cli-mcp"
version = "0.1.0"
description = "MCP server that exposes the Claude Code CLI (claude) as tools for orchestrator agents (Trae IDE)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=3.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "loguru>=0.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
]

[build-system]
requires = ["hatchling>=1.24.2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_code_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"